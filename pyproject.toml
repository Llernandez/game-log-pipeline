[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-log-pipeline"
version = "0.2.0"
description = "Synthetic idle-game reward integrity pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
# Only the networked services need these; the reference pipeline and its tests use the stdlib.
services = ["fastapi>=0.115", "uvicorn>=0.30", "confluent-kafka>=2.5", "psycopg[binary]>=3.2",
            "snowflake-connector-python>=3.12"]

[tool.setuptools]
packages = ["game_log_pipeline"]

[tool.setuptools.package-data]
game_log_pipeline = ["*.sql"]
