# Wave 0: our Helm chart. Wave 1: Airflow (upstream chart + values file from this repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-log-pipeline
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: default
  source:
    repoURL: https://github.com/Llernandez/game-log-pipeline.git
    targetRevision: main
    path: deploy/charts/game-log-pipeline
    helm:
      releaseName: glp
      valueFiles: [values-local.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: glp}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.22.0
      helm:
        releaseName: airflow
        valueFiles: [$values/deploy/platform/airflow/values-local.yaml]
    - repoURL: https://github.com/Llernandez/game-log-pipeline.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: glp}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
