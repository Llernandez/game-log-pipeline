# Wave -2: operators first, so their CRDs exist before the custom resources in later waves.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  # Server-side diff: the API server normalizes the large Kafka CRD, and a client-side diff
  # reports it OutOfSync forever (selfHeal then re-applies it every few minutes).
  annotations: {argocd.argoproj.io/sync-wave: "-2", argocd.argoproj.io/compare-options: ServerSideDiff=true}
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
  destination: {server: https://kubernetes.default.svc, namespace: kafka}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      releaseName: cnpg
  destination: {server: https://kubernetes.default.svc, namespace: cnpg-system}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Prometheus Operator CRDs + Prometheus/Grafana. Its CRDs exceed the client-side apply annotation
# limit, so this app needs ServerSideApply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2", argocd.argoproj.io/compare-options: ServerSideDiff=true}
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.1
      helm:
        releaseName: kps
        valueFiles: [$values/deploy/platform/monitoring/kube-prometheus-stack-values-local.yaml]
    - repoURL: https://github.com/Llernandez/game-log-pipeline.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
