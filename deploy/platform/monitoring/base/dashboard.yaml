# Grafana picks this up through its dashboard sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: glp-dashboard
  namespace: glp
  labels:
    grafana_dashboard: "1"
data:
  game-log-pipeline.json: |
    {
      "title": "game-log-pipeline",
      "uid": "glp-pipeline",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "panels": [
        {
          "title": "Ingest events / min",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum by (result) (rate(glp_ingest_events_total[5m])) * 60",
              "legendFormat": "{{result}}",
              "refId": "A"
            }
          ],
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Loader rows committed / min",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(glp_loader_rows_total[5m])) * 60",
              "legendFormat": "rows",
              "refId": "A"
            }
          ],
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Consumer lag (glp-loader)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum by (partition) (kafka_consumergroup_lag{consumergroup=\"glp-loader\"})",
              "legendFormat": "partition {{partition}}",
              "refId": "A"
            }
          ],
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Seconds since last loader commit",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "time() - max(glp_loader_last_commit_unixtime)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "title": "Failed rebuild pods",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"glp\", pod=~\"glp-rebuild.*\", phase=\"Failed\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        }
      ]
    }
