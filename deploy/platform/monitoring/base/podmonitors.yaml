# What Prometheus scrapes for this pipeline. Requires the Prometheus Operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: glp-ingest
  namespace: glp
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: game-log-pipeline, app.kubernetes.io/component: ingest}
  podMetricsEndpoints:
    - port: http
      path: /metrics/
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: glp-loader
  namespace: glp
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: game-log-pipeline, app.kubernetes.io/component: loader}
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
---
# Strimzi's Kafka exporter: consumer-group lag per topic partition.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: glp-kafka-exporter
  namespace: kafka
spec:
  selector:
    matchLabels: {strimzi.io/kind: Kafka, strimzi.io/name: glp-kafka-exporter}
  podMetricsEndpoints:
    - port: tcp-prometheus
      interval: 15s
